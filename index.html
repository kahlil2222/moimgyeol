<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모임결 · 참석 투표</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css">
<style>
  :root {
    --bg:#F2F4F7; --card:#fff; --subtle:#F0F2F6; --border:#E3E7EE;
    --fg:#191C2B; --muted:#6B7280; --faint:#ADB3BE;
    --accent:#2F5BFF; --marker:#D4FF3F;
    --success:#0FB57A; --successSoft:#E0F8EE; --warn:#F07B00; --danger:#FF3B5C;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { background:var(--bg); color:var(--fg); }
  body { font-family:'NanumSquareRound', system-ui, -apple-system, sans-serif; font-size:15px;
         line-height:1.5; padding:16px 16px calc(32px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  button, input, textarea { font:inherit; color:inherit; }
  .hero { background:var(--accent); color:#fff; border-radius:24px; padding:18px 20px 20px; }
  .hero .g { font-size:13px; opacity:.7; }
  .hero h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; margin:2px 0 10px; }
  .hero .when { font-size:16px; font-weight:800; }
  .hero .where { opacity:.85; }
  .chip { display:inline-block; margin-top:10px; background:var(--marker); color:var(--fg); border-radius:99px;
          padding:4px 10px; font-size:12.5px; font-weight:800; }
  h2 { font-size:18px; font-weight:800; letter-spacing:-.02em; margin:28px 4px 10px; }
  .card { background:var(--card); border-radius:20px; padding:16px; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .names { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .name { border:1px solid var(--border); background:var(--card); border-radius:99px; padding:8px 14px; font-weight:700; cursor:pointer; }
  .name:active { background:var(--subtle); }
  .hello { display:flex; align-items:center; margin:24px 4px 10px; }
  .hello b { flex:1; font-size:18px; font-weight:800; }
  .link { background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer; padding:6px; }
  .votes { display:flex; gap:8px; }
  .vote { flex:1; border:0; border-radius:16px; background:var(--card); padding:16px 0 14px; cursor:pointer;
          display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:800; font-size:15px; }
  .vote .i { font-size:24px; line-height:1; }
  .vote.on { color:#fff; }
  .vote:disabled { opacity:.6; }
  .counts { display:flex; }
  .counts div { flex:1; } .counts b { display:block; font-size:20px; font-weight:800; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .tag { background:var(--successSoft); color:var(--success); border-radius:99px; padding:3px 10px; font-size:12.5px; font-weight:700; }
  .c { display:flex; gap:10px; margin-bottom:14px; }
  .av { width:32px; height:32px; flex:none; border-radius:12px; background:var(--marker); display:grid; place-items:center;
        font-weight:800; font-size:13px; }
  .c .top { display:flex; gap:6px; align-items:baseline; }
  .c .top b { font-weight:700; } .c .top .del { margin-left:auto; }
  .c p { white-space:pre-wrap; word-break:break-word; }
  .write { display:flex; gap:6px; align-items:flex-end; }
  .write textarea { flex:1; border:1px solid var(--border); border-radius:14px; padding:10px 12px; resize:none; min-height:44px; max-height:120px; background:var(--subtle); }
  .send { width:44px; height:44px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-size:20px; cursor:pointer; }
  .send:disabled { background:var(--faint); }
  .center { text-align:center; padding:60px 10px; }
  .err { color:var(--danger); font-size:13px; margin-top:8px; }
  .foot { text-align:center; color:var(--faint); font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<main id="app"><p class="center muted">불러오는 중…</p></main>
<p class="foot">모임결 · 로그인 없이 투표하고 댓글을 남겨요</p>

<script>
// 공개용 키만 씁니다 (회원은 member_* 함수로 이 일정 하나만 읽고 씀).
const URL_ = 'https://frelonbfozmwofvmbzpx.supabase.co';
const KEY = 'sb_publishable_-2GS62bzPBseS5JB9qOKDA_pJ7oEZ6T';
const eventId = new URLSearchParams(location.search).get('e') || '';
const app = document.getElementById('app');

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const meKey = 'moimgyeol:me:' + eventId;
const tokKey = 'moimgyeol:tokens';

let data = null, me = store.get(meKey), busy = false, error = '';

async function rpc(fn, params) {
  const r = await fetch(`${URL_}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(params),
  });
  const text = await r.text();
  if (!r.ok) throw new Error(text);
  return text ? JSON.parse(text) : null;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const days = ['일','월','화','수','목','금','토'];
function when(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function ago(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return '방금'; if (m < 60) return `${m}분 전`;
  if (m < 1440) return `${Math.floor(m/60)}시간 전`;
  if (m < 10080) return `${Math.floor(m/1440)}일 전`;
  const d = new Date(iso); return `${d.getMonth()+1}월 ${d.getDate()}일`;
}

async function load() {
  try {
    data = eventId ? await rpc('member_event', { p_event: eventId }) : null;
    error = '';
  } catch { error = '불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'; }
  if (data && me && !data.members.some(m => m.id === me)) { me = null; store.set(meKey, null); }
  render();
}

async function act(job) {
  if (busy) return;
  busy = true; error = ''; render();
  try { await job(); await load(); }
  catch { error = '저장하지 못했어요. 연결을 확인하고 다시 눌러 주세요.'; }
  busy = false; render();
}

const VOTES = [
  ['yes', '참석', '✓', 'var(--success)'],
  ['maybe', '미정', '?', 'var(--warn)'],
  ['no', '불참', '✕', 'var(--muted)'],
];

function render() {
  if (!data) {
    app.innerHTML = `<p class="center muted">${error ? esc(error) : '일정을 찾을 수 없어요. 링크를 다시 확인해 주세요.'}</p>`;
    return;
  }
  const e = data.event, name = id => (data.members.find(m => m.id === id) || {}).name || '알 수 없음';
  const mine = (data.rsvps.find(r => r.member_id === me) || {}).response;
  const n = k => data.rsvps.filter(r => r.response === k).length;
  const going = data.rsvps.filter(r => r.response === 'yes').map(r => name(r.member_id));
  const tokens = store.get(tokKey) || {};
  document.title = `${e.title} · ${e.group_name}`;

  let h = `<section class="hero">
    <div class="g">${esc(e.group_name)}</div>
    <h1>${esc(e.title)}</h1>
    <div class="when">${when(e.starts_at)}</div>
    ${e.place ? `<div class="where">${esc(e.place)}</div>` : ''}
    ${e.fee > 0 ? `<span class="chip">행사비 ${e.fee.toLocaleString('ko-KR')}원</span>` : ''}
  </section>`;

  if (!me) {
    h += `<h2>누구세요?</h2><div class="card">
      <b>이름을 골라 주세요</b>
      <div class="muted small">이 기기에 기억해서 다음부터는 바로 열려요.</div>
      <div class="names">${data.members.map(m => `<button class="name" data-me="${m.id}">${esc(m.name)}</button>`).join('')}</div>
    </div>`;
  } else {
    h += `<div class="hello"><b>${esc(name(me))}님, 오실 거죠? 👋</b><button class="link" data-reset>내가 아니에요</button></div>
      <div class="votes">${VOTES.map(([k, label, icon, color]) => {
        const on = mine === k;
        return `<button class="vote ${on ? 'on' : ''}" data-vote="${k}" ${busy ? 'disabled' : ''}
          style="${on ? `background:${color}` : `color:var(--fg)`}">
          <span class="i" style="color:${on ? '#fff' : color}">${icon}</span>${label}</button>`;
      }).join('')}</div>`;
  }

  h += `<h2>지금까지</h2><div class="card">
    <div class="counts">
      <div><span class="muted small">참석</span><b style="color:var(--success)">${n('yes')}명</b></div>
      <div><span class="muted small">미정</span><b style="color:var(--warn)">${n('maybe')}명</b></div>
      <div><span class="muted small">불참</span><b style="color:var(--muted)">${n('no')}명</b></div>
    </div>
    ${going.length ? `<div class="tags">${going.map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>` : ''}
  </div>`;

  h += `<h2>댓글 ${data.comments.length}</h2><div class="card">
    ${data.comments.length ? '' : '<p class="muted small" style="margin-bottom:12px">아직 댓글이 없어요. 첫 댓글을 남겨 보세요!</p>'}
    ${data.comments.map(c => `<div class="c">
      <div class="av">${esc(name(c.member_id).slice(-2))}</div>
      <div style="flex:1;min-width:0">
        <div class="top"><b>${esc(name(c.member_id))}</b><span class="muted small">${ago(c.created_at)}</span>
          ${tokens[c.id] ? `<button class="link del" data-del="${c.id}">삭제</button>` : ''}</div>
        <p>${esc(c.body)}</p>
      </div></div>`).join('')}
    ${me ? `<div class="write">
        <textarea id="body" rows="1" maxlength="500" placeholder="댓글 남기기"></textarea>
        <button class="send" data-send ${busy ? 'disabled' : ''} aria-label="보내기">↑</button>
      </div>` : '<p class="muted small">이름을 고르면 댓글을 달 수 있어요.</p>'}
    ${error ? `<p class="err">${esc(error)}</p>` : ''}
  </div>`;

  const draft = document.getElementById('body')?.value || '';
  app.innerHTML = h;
  const ta = document.getElementById('body');
  if (ta) ta.value = draft;
}

app.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.me) { me = t.dataset.me; store.set(meKey, me); render(); }
  else if ('reset' in t.dataset) { me = null; store.set(meKey, null); render(); }
  else if (t.dataset.vote) {
    const mine = (data.rsvps.find(r => r.member_id === me) || {}).response;
    const next = mine === t.dataset.vote ? null : t.dataset.vote; // 같은 걸 다시 누르면 취소
    act(() => rpc('member_vote', { p_event: eventId, p_member: me, p_response: next }));
  }
  else if ('send' in t.dataset) {
    const ta = document.getElementById('body');
    const body = ta.value.trim();
    if (!body) return;
    act(async () => {
      const r = await rpc('member_comment', { p_event: eventId, p_member: me, p_body: body });
      const tokens = store.get(tokKey) || {}; tokens[r.id] = r.edit_token; store.set(tokKey, tokens);
      const cur = document.getElementById('body'); if (cur) cur.value = '';
    });
  }
  else if (t.dataset.del) {
    const tokens = store.get(tokKey) || {};
    act(async () => {
      await rpc('member_delete_comment', { p_comment: t.dataset.del, p_token: tokens[t.dataset.del] });
      delete tokens[t.dataset.del]; store.set(tokKey, tokens);
    });
  }
});

load();
// 다른 사람의 투표·댓글이 보이도록 화면에 돌아오면 새로 받아옴
document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) load(); });
</script>
</body>
</html>
