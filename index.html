<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모임결 · 참석 투표</title>
<meta name="robots" content="noindex">
<!-- 링크만 붙여넣었을 때 카카오톡·메신저 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:title" content="모임결 · 참석 투표">
<meta property="og:description" content="칸에 이름을 적고 확인을 누르면 투표돼요.">
<meta property="og:image" content="https://kahlil2222.github.io/moimgyeol/card.png">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="400">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css">
<style>
  :root {
    --bg:#F2F4F7; --card:#fff; --subtle:#F0F2F6; --border:#E3E7EE;
    --fg:#191C2B; --muted:#6B7280; --faint:#ADB3BE;
    --accent:#2F5BFF; --marker:#D4FF3F;
    --success:#0FB57A; --successSoft:#E0F8EE; --warn:#F07B00; --danger:#FF3B5C;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { background:var(--bg); color:var(--fg); }
  body { font-family:'NanumSquareRound', system-ui, -apple-system, sans-serif; font-size:15px;
         line-height:1.5; padding:16px 16px calc(32px + env(safe-area-inset-bottom)); max-width:520px; margin:0 auto; }
  button, input, textarea { font:inherit; color:inherit; }
  .hero { background:var(--accent); color:#fff; border-radius:24px; padding:18px 20px 20px; }
  .hero .g { font-size:13px; opacity:.7; }
  .hero h1 { font-size:24px; font-weight:800; letter-spacing:-.02em; margin:2px 0 10px; }
  .hero .when { font-size:16px; font-weight:800; }
  .hero .where { opacity:.85; }
  .chip { display:inline-block; margin-top:10px; background:var(--marker); color:var(--fg); border-radius:99px;
          padding:4px 10px; font-size:12.5px; font-weight:800; }
  h2 { font-size:18px; font-weight:800; letter-spacing:-.02em; margin:28px 4px 10px; }
  .card { background:var(--card); border-radius:20px; padding:16px; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .link { background:none; border:0; color:var(--muted); font-size:13px; cursor:pointer; padding:6px; }
  .guide { margin:-4px 4px 10px; }
  .slot { margin-bottom:10px; }
  .slot .head { display:flex; align-items:center; gap:6px; }
  .slot .head b { font-size:16px; font-weight:800; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .tag { background:var(--subtle); border-radius:99px; padding:4px 10px; font-size:13px; font-weight:700; }
  .tag.me { background:var(--fg); color:#fff; }
  .tag.me button { background:none; border:0; color:#fff; margin-left:2px; padding:0 2px; cursor:pointer; font:inherit; }
  .entry { display:flex; gap:6px; margin-top:12px; }
  .entry input, .who { flex:1; min-width:0; border:1px solid var(--border); border-radius:14px; padding:10px 12px; background:var(--subtle); }
  .who { width:100%; margin-bottom:8px; }
  .ok { border:0; border-radius:14px; background:var(--accent); color:#fff; font-weight:800; padding:0 18px; cursor:pointer; }
  .ok:disabled { background:var(--faint); }
  .c { display:flex; gap:10px; margin-bottom:14px; }
  .av { width:32px; height:32px; flex:none; border-radius:12px; background:var(--marker); display:grid; place-items:center;
        font-weight:800; font-size:13px; }
  .c .top { display:flex; gap:6px; align-items:baseline; }
  .c .top b { font-weight:700; } .c .top .del { margin-left:auto; }
  .c p { white-space:pre-wrap; word-break:break-word; }
  .write { display:flex; gap:6px; align-items:flex-end; }
  .write textarea { flex:1; min-width:0; border:1px solid var(--border); border-radius:14px; padding:10px 12px; resize:none; min-height:44px; max-height:120px; background:var(--subtle); }
  .send { width:44px; height:44px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-size:20px; cursor:pointer; }
  .send:disabled { background:var(--faint); }
  .center { text-align:center; padding:60px 10px; }
  .err { color:var(--danger); font-size:13px; margin-top:8px; }
  .foot { text-align:center; color:var(--faint); font-size:12px; margin-top:28px; }
</style>
</head>
<body>
<main id="app"><p class="center muted">불러오는 중…</p></main>
<p class="foot">모임결 · 로그인 없이 투표하고 댓글을 남겨요</p>

<script>
// 공개용 키만 씁니다 (회원은 member_* 함수로 이 일정 하나만 읽고 씀).
// 회원 명단은 받지 않고, 투표·댓글을 남긴 사람 이름만 보입니다.
const URL_ = 'https://frelonbfozmwofvmbzpx.supabase.co';
const KEY = 'sb_publishable_-2GS62bzPBseS5JB9qOKDA_pJ7oEZ6T';
const eventId = new URLSearchParams(location.search).get('e') || '';
const app = document.getElementById('app');

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
// 이 기기에서 마지막으로 적은 이름 (명단에 있는 정식 이름). 다음 칸을 열면 미리 채워 둡니다.
const meKey = 'moimgyeol:name';
const tokKey = 'moimgyeol:tokens';

let data = null, me = store.get(meKey), busy = false, error = '', errSlot = null, slotError = '';

async function rpc(fn, params) {
  const r = await fetch(`${URL_}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(params),
  });
  const text = await r.text();
  if (!r.ok) {
    let msg = text; try { msg = JSON.parse(text).message || text; } catch {}
    throw new Error(msg);
  }
  return text ? JSON.parse(text) : null;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const days = ['일','월','화','수','목','금','토'];
function when(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function ago(iso) {
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return '방금'; if (m < 60) return `${m}분 전`;
  if (m < 1440) return `${Math.floor(m/60)}시간 전`;
  if (m < 10080) return `${Math.floor(m/1440)}일 전`;
  const d = new Date(iso); return `${d.getMonth()+1}월 ${d.getDate()}일`;
}

async function load() {
  try {
    data = eventId ? await rpc('member_event', { p_event: eventId }) : null;
    error = '';
  } catch { error = '불러오지 못했어요. 잠시 뒤 다시 열어 주세요.'; }
  render();
}

// 서버가 돌려준 오류를 회원이 알아볼 말로 바꿉니다.
function why(err) {
  const m = String(err && err.message || '');
  if (m.includes('name_not_found')) return '명단에 없는 이름이에요. 총무에게 등록된 이름 그대로 적어 주세요.';
  if (m.includes('name_ambiguous')) return '같은 이름이 둘 있어요. 총무에게 말해 주세요.';
  return '저장하지 못했어요. 연결을 확인하고 다시 눌러 주세요.';
}

async function act(job, slot) {
  if (busy) return;
  busy = true; error = ''; slotError = ''; errSlot = null; render();
  try { await job(); await load(); }
  catch (err) { if (slot) { errSlot = slot; slotError = why(err); } else error = why(err); }
  busy = false; render();
}

const COLOR = { going:'var(--success)', maybe:'var(--warn)', no:'var(--muted)' };
const same = (a, b) => String(a || '').replace(/\s/g, '') === String(b || '').replace(/\s/g, '');

function render() {
  if (!data) {
    app.innerHTML = `<p class="center muted">${error ? esc(error) : '일정을 찾을 수 없어요. 링크를 다시 확인해 주세요.'}</p>`;
    return;
  }
  const e = data.event, opts = e.options || [];
  const tokens = store.get(tokKey) || {};
  document.title = `${e.title} · ${e.group_name}`;
  // 다시 그리기 전에 적던 글을 챙겨 둡니다
  const keep = id => document.getElementById(id)?.value;
  const draft = keep('body') || '', who = keep('who');
  const typed = {}; for (const o of opts) typed[o.id] = keep('slot-' + o.id);

  let h = `<section class="hero">
    <div class="g">${esc(e.group_name)}</div>
    <h1>${esc(e.title)}</h1>
    <div class="when">${when(e.starts_at)}</div>
    ${e.place ? `<div class="where">${esc(e.place)}</div>` : ''}
    ${e.fee > 0 ? `<span class="chip">행사비 ${e.fee.toLocaleString('ko-KR')}원</span>` : ''}
  </section>`;

  h += `<h2>참석 투표</h2><p class="muted small guide">해당하는 칸에 이름을 적고 확인을 눌러 주세요. 다른 칸에 적으면 그쪽으로 옮겨져요.</p>`;
  for (const o of opts) {
    const names = data.rsvps.filter(r => r.response === o.id).map(r => r.name);
    h += `<div class="card slot">
      <div class="head"><b style="color:${COLOR[o.group] || 'var(--fg)'}">${esc(o.label)}</b>
        <span class="muted small">${names.length}명</span></div>
      ${names.length ? `<div class="tags">${names.map(n => same(n, me)
        ? `<span class="tag me">${esc(n)}<button data-cancel="${esc(o.id)}" aria-label="내 이름 지우기" ${busy ? 'disabled' : ''}>✕</button></span>`
        : `<span class="tag">${esc(n)}</span>`).join('')}</div>` : ''}
      <div class="entry">
          <input id="slot-${esc(o.id)}" data-slot="${esc(o.id)}" maxlength="20" placeholder="이름 적기" autocomplete="name" enterkeyhint="done">
          <button class="ok" data-confirm="${esc(o.id)}" ${busy ? 'disabled' : ''}>확인</button>
        </div>${errSlot === o.id && slotError ? `<p class="err">${esc(slotError)}</p>` : ''}
    </div>`;
  }

  h += `<h2>댓글 ${data.comments.length}</h2><div class="card">
    ${data.comments.length ? '' : '<p class="muted small" style="margin-bottom:12px">아직 댓글이 없어요. 첫 댓글을 남겨 보세요!</p>'}
    ${data.comments.map(c => `<div class="c">
      <div class="av">${esc(c.name.slice(-2))}</div>
      <div style="flex:1;min-width:0">
        <div class="top"><b>${esc(c.name)}</b><span class="muted small">${ago(c.created_at)}</span>
          ${tokens[c.id] ? `<button class="link del" data-del="${c.id}">삭제</button>` : ''}</div>
        <p>${esc(c.body)}</p>
      </div></div>`).join('')}
    ${me ? `<p class="muted small" style="margin-bottom:6px">${esc(me)} 이름으로 남겨요</p>`
         : `<input id="who" class="who" maxlength="20" placeholder="내 이름">`}
    <div class="write">
      <textarea id="body" rows="1" maxlength="500" placeholder="댓글 남기기"></textarea>
      <button class="send" data-send ${busy ? 'disabled' : ''} aria-label="보내기">↑</button>
    </div>
    ${error ? `<p class="err">${esc(error)}</p>` : ''}
  </div>`;

  app.innerHTML = h;
  const set = (id, v) => { const el = document.getElementById(id); if (el && v != null) el.value = v; };
  set('body', draft); set('who', who);
  for (const o of opts) set('slot-' + o.id, typed[o.id]);
}

function confirmSlot(optionId) {
  const input = document.getElementById('slot-' + optionId);
  const name = (input?.value || '').trim();
  if (!name) { errSlot = optionId; slotError = '이름을 적어 주세요.'; render(); return; }
  act(async () => {
    me = await rpc('member_vote', { p_event: eventId, p_name: name, p_response: optionId });
    store.set(meKey, me);
    const cur = document.getElementById('slot-' + optionId); if (cur) cur.value = '';
  }, optionId);
}

app.addEventListener('click', ev => {
  const t = ev.target.closest('button');
  if (!t || busy) return;
  if (t.dataset.confirm) confirmSlot(t.dataset.confirm);
  else if (t.dataset.cancel) {
    act(() => rpc('member_vote', { p_event: eventId, p_name: me, p_response: null }));
  }
  else if ('send' in t.dataset) {
    const body = document.getElementById('body').value.trim();
    const name = me || (document.getElementById('who')?.value || '').trim();
    if (!body) return;
    if (!name) { error = '이름을 적어 주세요.'; render(); return; }
    act(async () => {
      const r = await rpc('member_comment', { p_event: eventId, p_name: name, p_body: body });
      const tokens = store.get(tokKey) || {}; tokens[r.id] = r.edit_token; store.set(tokKey, tokens);
      me = r.name; store.set(meKey, me);
      const cur = document.getElementById('body'); if (cur) cur.value = '';
    });
  }
  else if (t.dataset.del) {
    const tokens = store.get(tokKey) || {};
    act(async () => {
      await rpc('member_delete_comment', { p_comment: t.dataset.del, p_token: tokens[t.dataset.del] });
      delete tokens[t.dataset.del]; store.set(tokKey, tokens);
    });
  }
});
app.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.dataset.slot && !ev.isComposing) {
    ev.preventDefault(); if (!busy) confirmSlot(ev.target.dataset.slot);
  }
});

load();
// 다른 사람의 투표·댓글이 보이도록 화면에 돌아오면 새로 받아옴
document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) load(); });
</script>
</body>
</html>
